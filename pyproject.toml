[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dna_lib"
version = "0.1.0"
description = "DNA-Lib - Reusable DNA compression library: encode matrices into quantized Fourier genes"
requires-python = ">=3.9"
dependencies = ["numpy>=1.24"]

[tool.pytest.ini_options]
testpaths = ["tests"]
